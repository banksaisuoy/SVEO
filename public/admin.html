    <script>
        function showTab(tabName, event) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-users').classList.add('hidden');
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            
            // update active styling
            document.querySelectorAll('aside nav a').forEach(a => {
                a.classList.remove('bg-purple-600', 'text-white');
                a.classList.add('text-gray-400');
            });
            event.currentTarget.classList.remove('text-gray-400');
            event.currentTarget.classList.add('bg-purple-600', 'text-white');

            if (tabName === 'users') {
                loadUsers();
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                if (res.ok) {
                    const users = await res.json();
                    const tbody = document.getElementById('users-table-body');
                    tbody.innerHTML = '';
                    users.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-750 transition-colors';
                        
                        const statusBadge = user.suspended 
                            ? `<span class="bg-red-900 text-red-400 px-2 py-1 rounded text-xs font-medium border border-red-800">Suspended</span>`
                            : `<span class="bg-green-900 text-green-400 px-2 py-1 rounded text-xs font-medium border border-green-800">Active</span>`;
                        
                        const actionBtn = user.suspended
                            ? `<button onclick="toggleSuspend(${user.id}, false)" class="text-green-400 hover:text-green-300 transition-colors"><i class="fas fa-check-circle mr-1"></i>Unsuspend</button>`
                            : `<button onclick="toggleSuspend(${user.id}, true)" class="text-red-400 hover:text-red-300 transition-colors"><i class="fas fa-ban mr-1"></i>Suspend</button>`;

                        tr.innerHTML = `
                            <td class="py-4 px-4 whitespace-nowrap text-gray-300">#${user.id}</td>
                            <td class="py-4 px-4 whitespace-nowrap font-medium text-white">${user.username || 'Guest'}</td>
                            <td class="py-4 px-4 whitespace-nowrap text-gray-400">${user.role || 'user'}</td>
                            <td class="py-4 px-4 whitespace-nowrap">${statusBadge}</td>
                            <td class="py-4 px-4 whitespace-nowrap text-right">
                                ${user.role !== 'admin' ? actionBtn : '<span class="text-gray-500 text-xs">Admin</span>'}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error("Failed to load users:", err);
            }
        }

        async function toggleSuspend(id, suspended) {
            if(!confirm(`Are you sure you want to ${suspended ? 'suspend' : 'unsuspend'} this user?`)) return;
            try {
                const res = await fetch(`/api/admin/users/${id}/suspend`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ suspended })
                });
                if (res.ok) {
                    loadUsers(); // refresh list
                } else {
                    alert('Action failed.');
                }
            } catch(e) {
                console.error(e);
            }
        }
