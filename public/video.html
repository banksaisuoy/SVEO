<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video - VidGallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 shadow-lg mb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center hover:text-purple-400 transition-colors">
                    <i class="fas fa-video text-purple-500 text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight">VidGallery</span>
                </a>
                <a href="/" class="text-gray-300 hover:text-white"><i class="fas fa-arrow-left mr-2"></i>Back to Gallery</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
        <div class="bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
            <!-- Player -->
            <div id="video-player-container" class="w-full aspect-video bg-black relative">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
                </div>
            </div>
            
            <!-- Info -->
            <div class="p-6 md:p-8">
                <h1 id="video-title" class="text-3xl font-bold mb-4">Loading...</h1>
                
                <div class="flex items-center justify-between border-b border-gray-700 pb-6 mb-6">
                    <div class="flex items-center space-x-4">
                        <!-- Author / Stats could go here -->
                        <span class="bg-gray-700 text-gray-300 px-3 py-1 rounded-full text-sm font-medium">Published</span>
                    </div>
                    <div class="flex space-x-3">
                        <button class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-medium transition-colors flex items-center">
                            <i class="fas fa-share mr-2"></i>Share
                        </button>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-lg font-bold mb-2 text-gray-300">Description</h3>
                    <p id="video-description" class="text-gray-400 leading-relaxed whitespace-pre-line"></p>
                </div>
            </div>
        </div>
    </main>
    <script src="video.js"></script>
</body>
</html>
