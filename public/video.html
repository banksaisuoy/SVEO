                    <div class="mt-4 flex items-center space-x-3">
                        <button id="report-btn" class="bg-red-600 py-2 px-4 rounded text-white"><i class="fas fa-flag mr-2"></i>Report</button>
                        <button id="fav-btn" class="bg-yellow-600 py-2 px-4 rounded text-white"><i class="fas fa-star mr-2"></i>Favorite</button>
                        <button id="add-to-playlist-btn" class="bg-purple-600 py-2 px-4 rounded text-white"><i class="fas fa-list mr-2"></i>Add to Playlist</button>
                    </div>
                </div>

        </main>
    </div>

    <!-- Playlist Modal -->
    <div id="playlist-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-gray-800 p-6 rounded-lg w-full max-w-md shadow-2xl relative">
            <button id="close-playlist-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h2 class="text-2xl font-bold mb-4" data-lang-key="addToPlaylist">เพิ่มลงในเพลย์ลิสต์</h2>
            <div id="modal-playlists-list" class="space-y-2 mb-4 max-h-60 overflow-y-auto">
                <!-- User playlists will be loaded here -->
            </div>
            <hr class="border-gray-700 my-4">
            <form id="modal-create-playlist-form" class="flex flex-col gap-3">
                <input type="text" id="modal-new-playlist-name" placeholder="สร้างเพลย์ลิสต์ใหม่..." class="bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-lang-key="createPlaylist"><i class="fas fa-plus mr-2"></i>สร้าง & เพิ่ม</button>
            </form>
        </div>
    </div>

    <script src="video.js"></script>
</body>
</html>
