name: Auto Merge Jules PRs

on:
  pull_request:
    types: [opened, reopened, synchronized]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
      startsWith(github.event.pull_request.head.ref, 'jules-') ||
      contains(github.event.pull_request.body, 'Automated PR from Jules')
    steps:
      - name: Wait for build tests (10s grace period)
        run: sleep 10

      - name: Auto Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to merge PR ${{ github.event.pull_request.html_url }}"
          # Try regular merge first
          if gh pr merge ${{ github.event.pull_request.html_url }} --merge --delete-branch; then
            echo "✓ Merged successfully"
          else
            echo "Regular merge failed, trying admin merge..."
            if gh pr merge ${{ github.event.pull_request.html_url }} --merge --admin --delete-branch; then
              echo "✓ Admin merged"
            else
              echo "✗ Merge failed — PR will remain open for manual review"
              exit 0  # Don't fail the workflow
            fi
          fi
