name: Auto Merge Jules PRs

on:
  pull_request:
    types: [opened, reopened, synchronized]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
      startsWith(github.event.pull_request.head.ref, 'jules-') ||
      contains(github.event.pull_request.body, 'Automated PR from Jules')
    steps:
      - name: Wait for build tests (15s grace period)
        run: sleep 15

      - name: Check PR is not empty
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "Checking PR: $PR_URL"
          
          # Get PR details
          FILES_COUNT=$(gh pr view "$PR_URL" --json files --jq '.files | length')
          ADDITIONS=$(gh pr view "$PR_URL" --json additions --jq '.additions')
          DELETIONS=$(gh pr view "$PR_URL" --json deletions --jq '.deletions')
          
          echo "Files: $FILES_COUNT, Additions: $ADDITIONS, Deletions: $DELETIONS"
          
          # Skip if completely empty (0 files, 0 additions, 0 deletions)
          if [ "$FILES_COUNT" = "0" ] && [ "$ADDITIONS" = "0" ] && [ "$DELETIONS" = "0" ]; then
            echo "⚠️ Empty PR detected — closing instead of merging"
            gh pr close "$PR_URL" --comment "Auto-closed: empty PR (no files changed)"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Auto Merge PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to merge PR ${{ github.event.pull_request.html_url }}"
          # Try regular merge first
          if gh pr merge ${{ github.event.pull_request.html_url }} --merge --delete-branch; then
            echo "✓ Merged successfully"
          else
            echo "Regular merge failed, trying admin merge..."
            if gh pr merge ${{ github.event.pull_request.html_url }} --merge --admin --delete-branch; then
              echo "✓ Admin merged"
            else
              echo "✗ Merge failed — PR will remain open for manual review"
              exit 0
            fi
          fi
